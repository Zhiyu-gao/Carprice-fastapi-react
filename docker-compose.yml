version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: vehicle_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vehicle_price_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: vehicle_backend
    restart: always
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DB: vehicle_price_db
      OSS_ENABLED: "true"
      OSS_BUCKET: zhiyu-gao-20260206
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_PREFIX: car-price
    ports:
      - "8000:8000"
    command: >
      sh -c "
      uv sync &&
      uv run python create_database.py &&
      uv run alembic upgrade head &&
      uv run python -m app.train &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  ai_service:
    build: ./ai_service
    container_name: vehicle_ai_service
    restart: always
    env_file:
      - ./ai_service/.env
    ports:
      - "8080:8080"
    command: >
      sh -c "
      uv sync &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8080
      "

  frontend:
    build: ./frontend
    container_name: vehicle_frontend
    restart: always
    ports:
      - "80:80"

volumes:
  mysql_data:
