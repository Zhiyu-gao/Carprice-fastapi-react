services:
  nginx:
    image: nginx:latest
    container_name: vehicle_nginx
    restart: always
    depends_on:
      - frontend
      - frontend_mobile
      - backend
      - ai_service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/cert:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8
    container_name: vehicle_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vehicle_price_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    container_name: vehicle_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vehicle_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image does not ship wget/curl; use native binary presence check
      test: ["CMD-SHELL", "qdrant --version >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vehicle_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_PLEASE}
      ALGORITHM: ${ALGORITHM:-HS256}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DB: ${MYSQL_DB:-vehicle_price_db}
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-crawl}
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_AUTH_MODE: ${OSS_AUTH_MODE:-keys}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PREFIX: ${OSS_PREFIX:-car-price}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    command: >
      sh -c "
      uv run python create_database.py &&
      uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 8

  ai_service:
    build: ./ai_service
    container_name: vehicle_ai_service
    restart: always
    depends_on:
      qdrant:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./ai_service/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_PLEASE}
      ALGORITHM: ${ALGORITHM:-HS256}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:8000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8080:8080"
    volumes:
      - ./ai_service/data:/app/data
    command: >
      sh -c "
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8080
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 8

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: vehicle_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 15

  prometheus:
    image: prom/prometheus:latest
    container_name: vehicle_prometheus
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      ai_service:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: vehicle_grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  node_exporter:
    image: prom/node-exporter:latest
    container_name: vehicle_node_exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: vehicle_cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  frontend:
    build: ./frontend
    container_name: vehicle_frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

  frontend_mobile:
    build: ./mobile2
    container_name: vehicle_frontend_mobile
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  qdrant_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
