# 设备识别：手机走移动端，Pad/桌面走网页版
map $http_user_agent $is_phone {
    default 0;
    ~*(iphone|ipod|android.*mobile|windows phone|blackberry|opera mini|mobile) 1;
}

map $http_user_agent $is_tablet {
    default 0;
    ~*(ipad|tablet|nexus 7|nexus 9|sm-t|kindle|silk|playbook) 1;
}

map "$is_phone:$is_tablet" $use_mobile_frontend {
    default 0;
    "1:0" 1;
}

# ===============================
# HTTP (80) - certbot 验证 + 跳转 HTTPS
# ===============================
server {
    listen 80;
    server_name nrydawang.shop www.nrydawang.shop;

    # certbot 验证目录（必须）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部跳转 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
# HTTPS (443) - 正式服务
# ===============================
server {
    listen 443 ssl;
    server_name nrydawang.shop www.nrydawang.shop;

    ssl_certificate /etc/letsencrypt/live/nrydawang.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrydawang.shop/privkey.pem;

    # 推荐加上 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API 反代到 backend
    location /api/ {
        proxy_pass http://vehicle_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 服务反代
    location /ai/ {
        proxy_pass http://vehicle_ai_service:8080/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 移动端前端
    location = /m {
        return 302 /m/;
    }
    location /m/ {
        rewrite ^/m/(.*)$ /$1 break;
        proxy_pass http://vehicle_frontend_mobile:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 默认前端（桌面/Pad），手机自动跳移动端
    location / {
        if ($use_mobile_frontend = 1) {
            return 302 /m$request_uri;
        }
        proxy_pass http://vehicle_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
