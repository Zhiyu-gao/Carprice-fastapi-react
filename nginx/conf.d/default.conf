# ===============================
# HTTP (80) - certbot 验证 + 跳转 HTTPS
# ===============================
server {
    listen 80;
    server_name nrydawang.shop www.nrydawang.shop;

    # certbot 验证目录（必须）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部跳转 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
# HTTPS (443) - 正式服务
# ===============================
server {
    listen 443 ssl;
    server_name nrydawang.shop www.nrydawang.shop;

    ssl_certificate /etc/letsencrypt/live/nrydawang.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrydawang.shop/privkey.pem;

    # 推荐加上 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API 反代到 backend
    location /api/ {
        proxy_pass http://vehicle_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端反代
    location / {
        proxy_pass http://vehicle_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
