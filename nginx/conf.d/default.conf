# 设备识别：手机走移动端，Pad/桌面走网页版
map $http_user_agent $is_phone {
    default 0;
    ~*(iphone|ipod|android.*mobile|windows\s+phone|blackberry|opera\s+mini|mobile) 1;
}

map $http_user_agent $is_tablet {
    default 0;
    ~*(ipad|tablet|nexus\s+7|nexus\s+9|sm-t|kindle|silk|playbook) 1;
}

map $is_phone $frontend_upstream {
    1 http://frontend_mobile:80;
    0 http://frontend:80;
}

# ===============================
# HTTP (80) - certbot 验证 + 跳转 HTTPS
# ===============================
server {
    listen 80;
    server_name nrydawang.shop www.nrydawang.shop;

    # certbot 验证目录（必须）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部跳转 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
# HTTPS (443) - 正式服务
# ===============================
server {
    listen 443 ssl;
    server_name nrydawang.shop www.nrydawang.shop;

    resolver 127.0.0.11 ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/nrydawang.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrydawang.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API 反代到 backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公开资源（例如首页预览视频）走 backend
    location /public/ {
        proxy_pass http://backend:8000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 服务反代
    location /ai/ {
        proxy_pass http://ai_service:8080/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 价格分析接口（不带 /ai 前缀）
    location = /price-analysis {
        proxy_pass http://ai_service:8080/price-analysis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容旧的 /m 链接，统一跳回干净地址
    location = /m {
        return 302 /;
    }

    location /m/ {
        rewrite ^/m/?(.*)$ /$1 redirect;
    }

    # 根路径按设备分流：手机走移动端，桌面/Pad 走网页版
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
